<footer class="site-footer h-card">
  <data class="u-url" href="{{ '/' | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

    <form
      action="https://buttondown.com/api/emails/embed-subscribe/ramrobot"
      method="post"
      class="embeddable-buttondown-form"
    >
      <label for="bd-email">Subscribe to my newsletter</label>
      <div class="bd-row">
        <input type="email" name="email" id="bd-email" placeholder="you@example.com" />
        <input type="submit" value="Subscribe" />
      </div>
      <p>
        <a href="https://buttondown.com/refer/ramrobot" target="_blank">
          Powered by Buttondown.
        </a>
      </p>
    </form>

  </div>

</footer>
